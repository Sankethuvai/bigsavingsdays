<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bsd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bsd-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bsd-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bsd-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Savings Deal Tag -->
  <g filter="url(#glow)">
    <path d="M17.5 28.5L30 16H44C46.2 16 48 17.8 48 20V34C48 35.1 47.6 36.1 46.8 36.9L32.9 50.8C31.3 52.4 28.7 52.4 27.1 50.8L17.5 41.2C15.9 39.6 15.9 37 17.5 35.4L20 32.9" 
          fill="none" stroke="url(#bsd-tag)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tag Eyelet / Hole -->
    <circle cx="41" cy="23" r="2.8" fill="#34D399"/>
  </g>

  <!-- Dynamic Deal Lightning / Speed Link -->
  <path d="M34 19L23 33H33L30 47L43 31H33L36 19H34Z" 
        fill="url(#bsd-bolt)" stroke="#0F172A" stroke-width="1" stroke-linejoin="round"/>
</svg>
