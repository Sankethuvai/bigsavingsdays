services:
  velo:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/velo.db
      PORT: "3000"
    ports:
      # Bind to loopback: terminate TLS in Caddy/nginx/Traefik in front of this service.
      - "127.0.0.1:3000:3000"
    volumes:
      - velo-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  velo-data:
